# One-shot tool, not a long-running service -- invoke with:
#   docker compose run --rm bindery-bouncer --dump-sample
#   docker compose run --rm bindery-bouncer --verbose
#   docker compose run --rm bindery-bouncer --execute --confirmed-action quarantine
#
# Fill in AUDIOBOOKS_PATH / BINDERY_URL / BINDERY_API_KEY in a .env file next
# to this one (see .env.example) before running. --library-path inside the
# container is always /audiobooks -- that's the mount point below, not the
# host path.
#
# Unraid "Compose Manager" plugin: clone this repo (Dockerfile +
# docker-compose.yml need to sit together, since the build context is local)
# to wherever you keep compose projects, e.g. /mnt/user/appdata/bindery-bouncer,
# drop your .env there too, then in the plugin's Docker Compose tab use
# "Add New Stack" -> point it at that existing folder rather than pasting YAML
# into a fresh one. Clicking "Compose Up" runs one scan and the container then
# exits (0) on its own -- that's expected for a one-shot tool, not a crash.
# Run it again by clicking "Compose Up" each time you want another pass.

services:
  bindery-bouncer:
    build: .
    image: bindery-bouncer:latest
    container_name: bindery-bouncer
    volumes:
      - ${AUDIOBOOKS_PATH}:/audiobooks
    # So the default report filename (no --report-csv given) lands inside the
    # mounted library on the host instead of vanishing with the container on exit.
    working_dir: /audiobooks
    environment:
      - BINDERY_URL=${BINDERY_URL}
      - BINDERY_API_KEY=${BINDERY_API_KEY}
      # working_dir below is set to /audiobooks (so the default CSV report
      # path lands in the library on the host), which shadows the image's
      # WORKDIR /app -- without this, `python3 -m bindery_bouncer` can't
      # find its own module from the wrong cwd.
      - PYTHONPATH=/app
    # --bindery-path-prefix: confirmed via a live catalogue dump that Steve's
    # Bindery container sees audiobook files under /data/media/audiobooks
    # (not /audiobooks, which is only this container's own mount point) --
    # without this, every single local folder path fails to match anything
    # in the catalogue index, no matter how many books are indexed. This is
    # specific to how Bindery's own container is set up on blender; if you
    # ever repoint this at a different Bindery instance, re-check with
    # --dump-sample (look at a book's audiobookFilePath) before assuming
    # this value still applies.
    entrypoint: ["python3", "-m", "bindery_bouncer", "--library-path", "/audiobooks",
                 "--bindery-path-prefix", "/data/media/audiobooks"]
